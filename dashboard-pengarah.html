<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Pengarah - PBS UMK</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #1a202c; --accent: #d4af37; }
        body { font-family: 'Inter', sans-serif; background: #edf2f7; margin: 0; }
        .sidebar { width: 250px; background: var(--primary); color: white; height: 100vh; position: fixed; padding: 30px 20px; }
        .main-content { margin-left: 290px; padding: 40px; }
        .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 40px; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .card h2 { font-size: 2rem; margin: 5px 0; color: var(--primary); }
        table { width: 100%; background: white; border-radius: 15px; border-collapse: collapse; overflow: hidden; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #f2f2f2; }
        th { background: #2d3748; color: white; font-size: 0.75rem; text-transform: uppercase; }
        .filter-box { margin-bottom: 20px; }
        select { padding: 10px; border-radius: 8px; border: 1px solid #ccc; width: 200px; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2 style="color: var(--accent)">PENGARAH</h2>
    <p>Pusat Kebudayaan & Kesenian</p>
    <hr style="opacity: 0.2">
    <nav>
        <p>✓ Pemantauan Global</p>
        <p>✓ Analisis Kampus</p>
    </nav>
</div>

<div class="main-content">
    <h1>Ringkasan Keseluruhan Studio</h1>
    
    <div class="summary-grid">
        <div class="card"><h3>Bachok</h3><h2 id="total-bachok">0</h2></div>
        <div class="card"><h3>Kota</h3><h2 id="total-kota">0</h2></div>
        <div class="card"><h3>Jeli</h3><h2 id="total-jeli">0</h2></div>
        <div class="card"><h3>Jumlah Besar</h3><h2 id="grand-total">0</h2></div>
    </div>

    <div class="filter-box">
        <label>Tapis Ikut Kampus:</label>
        <select id="campusFilter" onchange="loadData()">
            <option value="all">Semua Kampus</option>
            <option value="bachok">Bachok</option>
            <option value="kota">Kampus Kota</option>
            <option value="jeli">Kampus Jeli</option>
        </select>
    </div>

    <table id="masterTable">
        <thead>
            <tr>
                <th>Kampus</th>
                <th>Pemohon</th>
                <th>Studio</th>
                <th>Tarikh</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
    const supabaseUrl = 'https://gwiuqthmkkvbopapixwk.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd3aXVxdGhta2t2Ym9wYXBpeHdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc4NDgyMDUsImV4cCI6MjA4MzQyNDIwNX0.fulrwEdy3ngAGG5gp3Vw950wV1r3-wSWvtRsWmz0uEg';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    async function loadData() {
        const filter = document.getElementById("campusFilter").value;
        let query = _supabase.from('bookings').select('*').order('created_at', { ascending: false });
        
        if (filter !== "all") {
            query = query.eq('campus', filter);
        }

        const { data } = await query;
        const tbody = document.querySelector("#masterTable tbody");
        tbody.innerHTML = "";

        let b = 0, k = 0, j = 0;

        data.forEach(row => {
            if(row.campus === 'bachok') b++;
            if(row.campus === 'kota') k++;
            if(row.campus === 'jeli') j++;

            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td><b style="text-transform:uppercase">${row.campus}</b></td>
                <td>${row.full_name}</td>
                <td>${row.studio_name}</td>
                <td>${row.start_date}</td>
                <td>${row.status}</td>
            `;
            tbody.appendChild(tr);
        });

        // Update stats (hanya jika paparan 'all')
        if(filter === "all") {
            document.getElementById("total-bachok").innerText = b;
            document.getElementById("total-kota").innerText = k;
            document.getElementById("total-jeli").innerText = j;
            document.getElementById("grand-total").innerText = data.length;
        }
    }

    loadData();
</script>
</body>
</html>
