<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - KAMPUS KOTA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #003366; --bachok: #2b6cb0; --success: #48bb78; --danger: #f56565; }
        body { font-family: 'Inter', sans-serif; margin: 0; background: #f7fafc; }
        header { background: var(--primary); color: white; padding: 20px; text-align: center; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
        .stat-card h3 { margin: 0; color: #718096; font-size: 0.9rem; }
        .stat-card p { font-size: 1.8rem; font-weight: 800; margin: 10px 0 0; color: var(--primary); }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        th { background: #edf2f7; padding: 15px; text-align: left; font-size: 0.8rem; text-transform: uppercase; color: #4a5568; }
        td { padding: 15px; border-bottom: 1px solid #edf2f7; font-size: 0.9rem; }
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
        .badge-pending { background: #feebc8; color: #92400e; }
        .badge-lulus { background: #c6f6d5; color: #22543d; }
        .btn { border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.8rem; transition: 0.2s; }
        .btn-lulus { background: var(--success); color: white; margin-right: 5px; }
        .btn-tolak { background: var(--danger); color: white; }
        .btn:hover { opacity: 0.8; }
    </style>
</head>
<body>

<header>
    <h1>DASHBOARD ADMIN: KAMPUS KOTA</h1>
    <p>Pengurusan Tempahan Studio Kampus Kota</p>
</header>

<div class="container">
    <div class="stats-grid">
        <div class="stat-card"><h3>MENUNGGU</h3><p id="count-pending">0</p></div>
        <div class="stat-card"><h3>LULUS</h3><p id="count-lulus">0</p></div>
        <div class="stat-card"><h3>JUMLAH</h3><p id="count-total">0</p></div>
    </div>

    <table id="bookingTable">
        <thead>
            <tr>
                <th>Pemohon</th>
                <th>Studio</th>
                <th>Tarikh</th>
                <th>Masa</th>
                <th>Status</th>
                <th>Tindakan</th>
            </tr>
        </thead>
        <tbody>
            </tbody>
    </table>
</div>

<script>
    const supabaseUrl = 'https://gwiuqthmkkvbopapixwk.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd3aXVxdGhta2t2Ym9wYXBpeHdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc4NDgyMDUsImV4cCI6MjA4MzQyNDIwNX0.fulrwEdy3ngAGG5gp3Vw950wV1r3-wSWvtRsWmz0uEg';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    async function fetchKampusKotaData() {
        const { data, error } = await _supabase
            .from('bookings')
            .select('*')
            .eq('campus', 'kota')
            .order('created_at', { ascending: false });

        if (error) return;

        const tbody = document.querySelector("#bookingTable tbody");
        tbody.innerHTML = "";
        
        let pending = 0, lulus = 0;

        data.forEach(row => {
            if(row.status === "Menunggu") pending++;
            if(row.status === "Lulus") lulus++;

            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td><strong>${row.full_name}</strong><br><small>${row.phone}</small></td>
                <td>${row.studio_name}</td>
                <td>${row.start_date} - ${row.end_date}</td>
                <td>${row.start_time} - ${row.end_time}</td>
                <td><span class="badge badge-${row.status.toLowerCase()}">${row.status}</span></td>
                <td>
                    ${row.status === 'Menunggu' ? `
                        <button class="btn btn-lulus" onclick="updateStatus('${row.id}', 'Lulus')">Lulus</button>
                        <button class="btn btn-tolak" onclick="updateStatus('${row.id}', 'Tolak')">Tolak</button>
                    ` : '<small>Selesai</small>'}
                </td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById("count-pending").innerText = pending;
        document.getElementById("count-lulus").innerText = lulus;
        document.getElementById("count-total").innerText = data.length;
    }

    async function updateStatus(id, newStatus) {
        if(!confirm(`Adakah anda pasti untuk ${newStatus} permohonan ini?`)) return;
        const { error } = await _supabase.from('bookings').update({ status: newStatus }).eq('id', id);
        if(!error) fetchKampusKotaData();
    }

    fetchKampusKotaData();
</script>
</body>
</html>
