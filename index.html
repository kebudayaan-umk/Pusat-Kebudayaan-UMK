<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Tempahan Studio PKUMK</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #003366;
            --accent-color: #d4af37;
            --bg-color: #f0f2f5;
            --text-dark: #333;
            --white: #ffffff;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-dark);
        }

        /* Header Styling */
        .header {
            position: relative;
            background: url("assets/bg-kebudayaan.jpg") center/cover no-repeat;
            padding: 60px 20px;
            text-align: center;
        }

        .header::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.85);
        }

        .header-content { position: relative; z-index: 1; }
        .logo-umk { height: 70px; margin-bottom: 15px; }
        .header h1 { margin: 0; font-size: 1.5rem; color: var(--primary-color); text-transform: uppercase; }

        /* Form Container */
        .container {
            max-width: 750px;
            background: var(--white);
            padding: 35px;
            border-radius: 12px;
            margin: -30px auto 50px auto;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            position: relative;
            z-index: 2;
        }

        h2 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
            margin-bottom: 25px;
            font-size: 1.3rem;
        }

        /* Layout Grid */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .full-width { grid-column: span 2; }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: #444;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: border 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0,51,102,0.1);
        }

        /* Info Section */
        .syarat {
            background: #fff9e6;
            padding: 20px;
            border-radius: 8px;
            border-left: 5px solid var(--accent-color);
            margin-top: 25px;
            font-size: 0.85rem;
        }

        .persetujuan {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-top: 20px;
        }

        .persetujuan input { width: auto; margin-top: 4px; }

        button {
            background: var(--primary-color);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 6px;
            width: 100%;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 25px;
            transition: 0.3s;
        }

        button:hover { background: #002244; transform: translateY(-2px); }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="header-content">
        <img src="assets/logo-umk.png" class="logo-umk" alt="Logo UMK">
        <h1>Pusat Kebudayaan<br>Universiti Malaysia Kelantan</h1>
    </div>
</div>

<div class="container">
    <h2>Maklumat Tempahan</h2>
    
    <form action="../backend/submit.php" method="POST">
        <div class="form-grid">
            <div class="full-width">
                <label>Nama Penuh</label>
                <input type="text" name="nama" placeholder="Sila masukkan nama penuh" required>
            </div>

            <div>
                <label>No. Kad Pengenalan</label>
                <input type="text" name="no_ic" placeholder="Contoh: 001122031234" required>
            </div>

            <div>
                <label>No. Matrik / Staf</label>
                <input type="text" name="no_id" placeholder="Contoh: A21A0001 / P9901" required>
            </div>

            <div>
                <label>Kampus</label>
                <select id="kampus" name="kampus" required>
                    <option value="">-- Pilih Kampus --</option>
                    <option value="bachok">Bachok</option>
                    <option value="kota">Kampus Kota</option>
                    <option value="jeli">Jeli</option>
                </select>
            </div>

            <div>
                <label>Pilihan Studio</label>
                <select id="studio" name="studio" required>
                    <option value="">-- Pilih Kampus Dahulu --</option>
                </select>
            </div>

            <div>
                <label>Tarikh Penggunaan</label>
                <input type="date" name="tarikh" required>
            </div>

            <div>
                <label>Waktu (Mula - Tamat)</label>
                <div style="display: flex; gap: 8px;">
                    <input type="time" name="masa_mula" required>
                    <input type="time" name="masa_tamat" required>
                </div>
            </div>
        </div>

        <div class="syarat">
            <strong>Syarat Penggunaan:</strong>
            <p style="margin: 5px 0;">1. Permohonan mestilah dibuat 3 hari sebelum tarikh penggunaan.</p>
            <p style="margin: 5px 0;">2. Bertanggungjawab atas kebersihan dan keselamatan peralatan.</p>
            <p style="margin: 5px 0; color: #d9534f;"><strong>* Sebarang kerosakan akan dikenakan denda/ganti rugi.</strong></p>
        </div>

        <div class="persetujuan">
            <input type="checkbox" id="setuju" name="setuju" required>
            <label for="setuju">Saya telah membaca dan bersetuju dengan segala terma dan syarat.</label>
        </div>

        <button type="submit">Hantar Permohonan</button>
    </form>
</div>

<script>
    const studioList = {
        bachok: ["Teniat 3", "Teniat 4"],
        kota: ["Studio Tari", "Studio Band", "Studio Gamelan"],
        jeli: ["Surau Lama", "Dewan Utama"]
    };

    const kampus = document.getElementById("kampus");
    const studio = document.getElementById("studio");

    kampus.addEventListener("change", () => {
        studio.innerHTML = '<option value="">-- Pilih Studio --</option>';
        if(kampus.value && studioList[kampus.value]) {
            studioList[kampus.value].forEach(s => {
                let o = document.createElement("option");
                o.value = s;
                o.text = s;
                studio.add(o);
            });
        }
    });
</script>

</body>
</html>
