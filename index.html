<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Tempahan Studio</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Sila kekalkan CSS asal anda di sini (Saya biarkan kosong untuk anda paste balik CSS asal anda) */
        body { font-family: sans-serif; padding: 20px; }
        form { display: flex; flex-direction: column; max-width: 500px; gap: 10px; }
        input, select, button { padding: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Borang Permohonan Tempahan Studio</h2>
        <form id="bookingForm">
            <input type="text" id="nama" placeholder="Nama Penuh" required>
            <input type="text" id="no_id" placeholder="No. ID (Staff/Pelajar)" required>
            
            <input type="text" id="no_ic" placeholder="No. Kad Pengenalan" required>

            <select id="kategori" required>
                <option value="">-- Pilih Kategori --</option>
                <option value="Staff">Staff</option>
                <option value="Pelajar">Pelajar</option>
                <option value="Luar">Pihak Luar</option>
            </select>

            <input type="email" id="email" placeholder="Alamat Emel" required>

            <select id="kampus" required>
                <option value="">-- Pilih Kampus --</option>
                <option value="Kampus A">Kampus A</option>
                <option value="Kampus B">Kampus B</option>
                </select>

            <select id="studio" required>
                <option value="">-- Pilih Studio --</option>
            </select>

            <select id="slot" required>
                <option value="">-- Pilih Slot Penggunaan --</option>
                <option value="Slot 1 (08:00 - 10:00)">Slot 1 (08:00 - 10:00)</option>
                <option value="Slot 2 (10:00 - 12:00)">Slot 2 (10:00 - 12:00)</option>
                <option value="Slot 3 (14:00 - 16:00)">Slot 3 (14:00 - 16:00)</option>
                <option value="Slot 4 (16:00 - 18:00)">Slot 4 (16:00 - 18:00)</option>
            </select>

            <input type="date" id="tarikh" required>
            <input type="time" id="masaMula" required>
            <input type="time" id="masaTamat" required>

            <div class="checkbox-group">
                <input type="checkbox" id="setuju" required>
                <label for="setuju">Saya bersetuju dengan segala syarat penggunaan studio.</label>
            </div>

            <button type="submit" id="submitBtn">Hantar Permohonan</button>
        </form>
    </div>

<script>
    // --- KONFIGURASI SUPABASE ---
    const supabaseClient = supabase.createClient('URL_ANDA', 'KEY_ANDA');

    // --- DATA STUDIO (Gunakan data penuh 300 baris anda di sini) ---
    const studioData = {
        "Kampus A": ["Studio Muzik", "Studio Rakaman", "Studio Fotografi"],
        "Kampus B": ["Studio TV", "Studio Radio", "Bilik Edit"]
        // Paste balik semua list studio asal anda yang banyak itu di sini
    };

    const studioSelect = document.getElementById("studio");
    const kampusSelect = document.getElementById("kampus");

    // 2. LOGIK PILIHAN STUDIO (Fungsi Asal)
    kampusSelect.addEventListener("change", function () {
        const kampus = this.value;
        studioSelect.innerHTML = '<option value="">-- Pilih Studio --</option>';

        if (studioData[kampus]) {
            studioData[kampus].forEach(function (studio) {
                const option = document.createElement("option");
                option.textContent = studio;
                option.value = studio;
                studioSelect.appendChild(option);
            });
        }
    });

    // 3. LOGIK PENGHANTARAN BORANG
    const bookingForm = document.getElementById("bookingForm");
    const submitBtn = document.getElementById("submitBtn");

    bookingForm.addEventListener("submit", async function (e) {
        e.preventDefault();
// Ambil Nilai Input (Kekal susunan asal + 3 tambahan)
        const nama = document.getElementById("nama").value;
        const no_id = document.getElementById("no_id").value;
        const no_ic = document.getElementById("no_ic").value;      // Tambahan 2
        const kategori = document.getElementById("kategori").value; // Tambahan 3
        const email = document.getElementById("email").value;
        const kampus = document.getElementById("kampus").value;
        const studio = document.getElementById("studio").value;
        const slot = document.getElementById("slot").value;         // Tambahan 1
        const tarikh = document.getElementById("tarikh").value;
        const masaMula = document.getElementById("masaMula").value;
        const masaTamat = document.getElementById("masaTamat").value;
        const setuju = document.getElementById("setuju").checked;

        // --- VALIDASI TARIKH (MINIMA 3 HARI) ---
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const pilihanTarikh = new Date(tarikh);
        const diffTime = pilihanTarikh - today;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

        if (diffDays < 3) {
            alert("Ralat: Permohonan perlu dibuat sekurang-kurangnya 3 hari sebelum tarikh penggunaan.");
            return;
        }

        // --- LOGIK SEMAKAN PERTEMBUNGAN (ANTI-DOUBLE BOOKING) ---
        submitBtn.innerText = "Menyemak Kekosongan...";
        submitBtn.disabled = true;

        try {
            // Semak jika slot sudah 'approved'
            const { data: sediaAda, error: checkError } = await supabaseClient
                .from('permohonan')
                .select('id')
                .eq('studio', studio)
                .eq('tarikh', tarikh)
                .eq('slot', slot) // Tambahan semakan slot
                .eq('status', 'approved');

            if (checkError) throw checkError;

            // Jika ada data yang sudah 'approved' pada slot tersebut
            if (sediaAda && sediaAda.length > 0) {
                alert(`Maaf, slot untuk ${studio} pada tarikh dan masa tersebut telahpun ditempah (LULUS). Sila pilih waktu atau studio lain.`);
                submitBtn.innerText = "Hantar Permohonan";
                submitBtn.disabled = false;
                return;
            }

            // --- PROSES HANTAR KE SUPABASE ---
            submitBtn.innerText = "Menghantar...";

            const { data, error } = await supabaseClient
                .from('permohonan')
                .insert([
                    { 
                        nama: nama, 
                        no_id: no_id,
                        no_ic: no_ic,       // Simpan IC
                        kategori: kategori, // Simpan Kategori
                        email: email,
                        kampus: kampus,
                        studio: studio,
                        slot: slot,         // Simpan Slot
                        tarikh: tarikh, 
                        masa_mula: masaMula, 
                        masa_tamat: masaTamat,
                        status: 'pending' 
                    }
                ]);

            if (error) throw error;

            alert("✅ Berjaya! Permohonan anda telah dihantar dan akan diproses.");
            bookingForm.reset();
            studioSelect.innerHTML = '<option value="">-- Pilih Kampus Dahulu --</option>';

        } catch (err) {
            console.error("Ralat:", err.message);
            alert("❌ Gagal menghantar: " + err.message);
        } finally {
            submitBtn.innerText = "Hantar Permohonan";
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
