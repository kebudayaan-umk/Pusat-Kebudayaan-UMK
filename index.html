<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Tempahan Studio</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; margin: 20px; line-height: 1.6; }
        .form-container { max-width: 600px; margin: auto; border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select, button { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:disabled { background-color: #ccc; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Borang Tempahan Studio</h2>
    <form id="bookingForm">
        <div class="form-group">
            <label>Nama Penuh</label>
            <input type="text" id="nama" required placeholder="Contoh: Ahmad Bin Ali">
        </div>

        <div class="form-group">
            <label>No. ID (Staff/Pelajar)</label>
            <input type="text" id="no_id" required placeholder="Contoh: SWP12345">
        </div>

        <div class="form-group">
            <label>No. Kad Pengenalan</label>
            <input type="text" id="no_ic" required placeholder="Contoh: 900101105555">
        </div>

        <div class="form-group">
            <label>Kategori</label>
            <select id="kategori" required>
                <option value="">-- Pilih Kategori --</option>
                <option value="Staff">Staff</option>
                <option value="Pelajar">Pelajar</option>
                <option value="Pihak Luar">Pihak Luar</option>
            </select>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" required placeholder="email@example.com">
        </div>

        <div class="form-group">
            <label>Kampus</label>
            <select id="kampus" required>
                <option value="">-- Pilih Kampus --</option>
                <option value="Kampus A">Kampus A</option>
                <option value="Kampus B">Kampus B</option>
            </select>
        </div>

        <div class="form-group">
            <label>Studio</label>
            <select id="studio" required>
                <option value="">-- Pilih Kampus Dahulu --</option>
            </select>
        </div>

        <div class="form-group">
            <label>Slot Tempahan</label>
            <select id="slot" required>
                <option value="">-- Pilih Slot --</option>
                <option value="Pagi (08:00 - 12:00)">Pagi (08:00 - 12:00)</option>
                <option value="Petang (14:00 - 18:00)">Petang (14:00 - 18:00)</option>
                <option value="Malam (20:00 - 23:00)">Malam (20:00 - 23:00)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Tarikh Penggunaan</label>
            <input type="date" id="tarikh" required>
        </div>

        <div style="display: flex; gap: 10px;">
            <div class="form-group" style="flex: 1;">
                <label>Masa Mula</label>
                <input type="time" id="masaMula" required>
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Masa Tamat</label>
                <input type="time" id="masaTamat" required>
            </div>
        </div>

        <button type="submit" id="submitBtn">Hantar Permohonan</button>
    </form>
</div>

<script>
    // --- KONFIGURASI SUPABASE (Gantikan dengan Key Anda) ---
    const SUPABASE_URL = 'https://YOUR_PROJECT_URL.supabase.co';
    const SUPABASE_KEY = 'YOUR_ANON_KEY';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // --- DATA STUDIO ---
    const studioData = {
"Kampus A": ["Studio Muzik", "Studio Rakaman", "Studio Fotografi"],
        "Kampus B": ["Studio TV", "Studio Radio", "Bilik Edit"]
    };

    // --- LOGIK PILIHAN STUDIO DINAMIK ---
    const kampusSelect = document.getElementById("kampus");
    const studioSelect = document.getElementById("studio");

    kampusSelect.addEventListener("change", function () {
        const kampus = this.value;
        studioSelect.innerHTML = '<option value="">-- Pilih Studio --</option>';

        if (studioData[kampus]) {
            studioData[kampus].forEach(function (studio) {
                const option = document.createElement("option");
                option.textContent = studio;
                option.value = studio;
                studioSelect.appendChild(option);
            });
        }
    });

    // --- LOGIK PENGHANTARAN BORANG ---
    const bookingForm = document.getElementById("bookingForm");
    const submitBtn = document.getElementById("submitBtn");

    bookingForm.addEventListener("submit", async function (e) {
        e.preventDefault();

        // 1. Ambil Nilai Input
        const nama = document.getElementById("nama").value;
        const no_id = document.getElementById("no_id").value;
        const no_ic = document.getElementById("no_ic").value;
        const kategori = document.getElementById("kategori").value;
        const email = document.getElementById("email").value;
        const kampus = document.getElementById("kampus").value;
        const studio = document.getElementById("studio").value;
        const slot = document.getElementById("slot").value;
        const tarikh = document.getElementById("tarikh").value;
        const masaMula = document.getElementById("masaMula").value;
        const masaTamat = document.getElementById("masaTamat").value;

        // 2. Validasi Tarikh (Minima 3 Hari)
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const pilihanTarikh = new Date(tarikh);
        const diffDays = Math.ceil((pilihanTarikh - today) / (1000 * 60 * 60 * 24));

        if (diffDays < 3) {
            alert("Ralat: Permohonan perlu dibuat sekurang-kurangnya 3 hari sebelum tarikh penggunaan.");
            return;
        }

        // 3. Semakan Pertembungan (Anti-Double Booking)
        submitBtn.innerText = "Menyemak Kekosongan...";
        submitBtn.disabled = true;

        try {
            const { data: sediaAda, error: checkError } = await supabaseClient
                .from('permohonan')
                .select('id')
                .eq('studio', studio)
                .eq('tarikh', tarikh)
                .eq('slot', slot)
                .eq('status', 'approved');

            if (checkError) throw checkError;

            if (sediaAda && sediaAda.length > 0) {
                alert(`Maaf, ${slot} untuk ${studio} pada tarikh tersebut telahpun ditempah (LULUS). Sila pilih slot lain.`);
                return;
            }

            // 4. Proses Hantar ke Supabase
            submitBtn.innerText = "Menghantar...";

            const { error } = await supabaseClient
                .from('permohonan')
                .insert([
                    { 
                        nama, 
                        no_id,
                        no_ic,      
                        kategori,   
                        email,
                        kampus,
                        studio,
                        slot,       
                        tarikh, 
                        masa_mula: masaMula, 
                        masa_tamat: masaTamat,
                        status: 'pending' 
                    }
                ]);

            if (error) throw error;

            alert("✅ Berjaya! Permohonan anda telah dihantar.");
            bookingForm.reset();
            studioSelect.innerHTML = '<option value="">-- Pilih Kampus Dahulu --</option>';

        } catch (err) {
            console.error("Ralat:", err.message);
            alert("❌ Gagal: " + err.message);
        } finally {
            submitBtn.innerText = "Hantar Permohonan";
submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
