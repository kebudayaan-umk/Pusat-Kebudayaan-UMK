<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Tempahan Studio PKUMK</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #003366;
            --accent-color: #d4af37;
            --bg-color: #f0f2f5;
            --text-dark: #333;
            --white: #ffffff;
            --danger: #cc0000;
        }

        body { font-family: 'Inter', sans-serif; margin: 0; background-color: var(--bg-color); color: var(--text-dark); line-height: 1.6; }

        /* HEADER */
        .header { position: relative; background: #fff; padding: 60px 20px; text-align: center; border-bottom: 5px solid var(--accent-color); }
        .header-content { position: relative; z-index: 1; }
        .logo-umk { height: 110px; margin-bottom: 15px; }
        .header h1 { margin: 0; font-size: 1.6rem; color: var(--primary-color); text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px; }
        
        .contact-info { margin-top: 12px; font-size: 0.95rem; }
        .contact-info a { color: var(--primary-color); text-decoration: none; font-weight: 700; padding: 5px 10px; }
        .contact-info a:hover { color: var(--accent-color); text-decoration: underline; }

        .container { max-width: 850px; background: var(--white); padding: 35px; border-radius: 12px; margin: 30px auto; box-shadow: 0 8px 30px rgba(0,0,0,0.1); }
        
        h2 { color: var(--primary-color); border-bottom: 2px solid var(--accent-color); padding-bottom: 10px; margin-bottom: 20px; font-size: 1.3rem; font-weight: 700; }

        /* FORM GRID */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px 20px; }
        .full-width { grid-column: span 2; }
        label { display: block; font-weight: 700; font-size: 0.85rem; margin-bottom: 6px; color: #444; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        textarea { resize: vertical; min-height: 80px; }

        /* TICKBOX KEMAS KE KIRI */
        .persetujuan { display: flex; align-items: flex-start; gap: 12px; margin-top: 25px; font-weight: 700; font-size: 0.85rem; cursor: pointer; }
        .persetujuan input[type="checkbox"] { width: 18px; height: 18px; margin-top: 3px; cursor: pointer; flex-shrink: 0; }

        .error-msg { color: var(--danger); font-size: 0.75rem; font-weight: 700; display: none; margin-top: 5px; }

        button { background: var(--primary-color); color: white; padding: 16px; border: none; border-radius: 6px; width: 100%; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 25px; text-transform: uppercase; transition: 0.3s; }
        button:hover { background: #002244; transform: translateY(-2px); }
        button:disabled { background: #ccc; cursor: not-allowed; }

        @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } .full-width { grid-column: span 1; } }
    </style>
</head>
<body>

<div class="header">
    <div class="header-content">
        <img src="assets/logo-umk.png" class="logo-umk" alt="Logo UMK">
        <h1>Pusat Kebudayaan<br>Universiti Malaysia Kelantan</h1>
        <div class="contact-info">
            <a href="mailto:kebudayaan@umk.edu.my">kebudayaan@umk.edu.my</a> | 
            <a href="tel:+6097797436">+609-779 7436</a>
        </div>
    </div>
</div>

<div class="container">
    <form id="bookingForm" action="submit.php" method="POST">
        <h2>Borang Tempahan Studio</h2>
        
        <div class="form-grid">
            <div class="full-width">
                <label>Nama Penuh</label>
                <input type="text" name="nama" required>
            </div>

            <div>
                <label>No. Kad Pengenalan</label>
                <input type="text" name="no_ic" maxlength="12" required>
            </div>

            <div>
                <label>No. Matrik / No. Staf</label>
                <input type="text" name="no_id" required>
            </div>

            <div>
                <label>Kampus</label>
                <select id="kampus" name="kampus" required>
                    <option value="">-- Pilih Kampus --</option>
                    <option value="bachok">Bachok</option>
                    <option value="kota">Kampus Kota</option>
                    <option value="jeli">Jeli</option>
                </select>
            </div>

            <div>
                <label>Pilihan Studio</label>
                <select id="studio" name="studio" required>
                    <option value="">-- Pilih Kampus Dahulu --</option>
                </select>
            </div>

            <div>
                <label>Tarikh Penggunaan</label>
                <input type="date" id="tarikh_tempahan" name="tarikh" required>
            </div>

            <div>
                <label>Masa Mula</label>
                <select id="masa_mula" name="masa_mula" required>
                    <option value="">-- Pilih Waktu --</option>
                    <option value="9">09:00 AM</option>
                    <option value="10">10:00 AM</option>
                    <option value="11">11:00 AM</option>
                    <option value="12">12:00 PM</option>
                    <option value="14">02:00 PM</option>
                    <option value="15">03:00 PM</option>
                    <option value="17">05:00 PM</option>
                    <option value="18">06:00 PM</option>
                    <option value="21">09:00 PM</option>
                    <option value="22">10:00 PM</option>
                </select>
            </div>

            <div>
                <label>Masa Tamat</label>
                <select id="masa_tamat" name="masa_tamat" required>
                    <option value="">-- Pilih Waktu --</option>
                    <option value="10">10:00 AM</option>
                    <option value="11">11:00 AM</option>
                    <option value="12">12:00 PM</option>
                    <option value="13">01:00 PM</option>
                    <option value="15">03:00 PM</option>
                    <option value="16">04:00 PM</option>
                    <option value="18">06:00 PM</option>
                    <option value="19">07:00 PM</option>
                    <option value="22">10:00 PM</option>
                    <option value="23">11:00 PM</option>
                </select>
                <div id="timeError" class="error-msg">Masa tamat mestilah selepas masa mula!</div>
            </div>

            <div class="full-width">
                <label>Keperluan Teknikal (Cth: Mikrofon, Speaker, Kabel)</label>
                <textarea name="teknikal" placeholder="Nyatakan bilangan dan jenis peralatan teknikal yang diperlukan..."></textarea>
            </div>

            <div class="full-width">
                <label>Barang Keperluan Penempah (Cth: Kerusi, Meja, Hiasan)</label>
                <textarea name="keperluan_penempah" placeholder="Nyatakan barang-barang lain yang diperlukan untuk urusan penempah..."></textarea>
            </div>
        </div>

        <label class="persetujuan">
            <input type="checkbox" name="setuju" required>
            <span>Saya bersetuju dengan syarat penggunaan studio dan bertanggungjawab ke atas peralatan yang digunakan.</span>
        </label>

        <button type="submit" id="submitBtn">Hantar Permohonan</button>
    </form>
</div>

<script>
    // Logik Studio
    const studioList = {
        bachok: ["Teniat 3", "Teniat 4"],
        kota: ["Studio Tari", "Studio Muzik", "Studio Gamelan"],
        jeli: ["Studio Kebudayaan"]
    };

    document.getElementById("kampus").addEventListener("change", function() {
        const studioSelect = document.getElementById("studio");
        studioSelect.innerHTML = '<option value="">-- Pilih Studio --</option>';
        if(this.value) {
            studioList[this.value].forEach(s => {
                let opt = document.createElement("option");
                opt.value = s; opt.text = s;
                studioSelect.add(opt);
            });
        }
    });

    // Validasi Masa
    const masaMula = document.getElementById("masa_mula");
    const masaTamat = document.getElementById("masa_tamat");
    const submitBtn = document.getElementById("submitBtn");
    const timeError = document.getElementById("timeError");

    function checkTime() {
        if(masaMula.value && masaTamat.value) {
            if(parseInt(masaTamat.value) <= parseInt(masaMula.value)) {
                timeError.style.display = "block";
                submitBtn.disabled = true;
            } else {
                timeError.style.display = "none";
                submitBtn.disabled = false;
            }
        }
    }
    masaMula.addEventListener("change", checkTime);
    masaTamat.addEventListener("change", checkTime);

    // Had Tarikh (Min 3 hari)
    const dt = new Date();
    dt.setDate(dt.getDate() + 3);
    document.getElementById("tarikh_tempahan").min = dt.toISOString().split("T")[0];
</script>

</body>
</html>
