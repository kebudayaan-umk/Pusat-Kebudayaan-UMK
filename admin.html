<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard PKUMK</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary-color: #003366;
            --accent-color: #d4af37;
            --bg-color: #f0f2f5;
            --white: #ffffff;
            --danger: #e53e3e;
            --success: #2f855a;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            background-color: var(--bg-color); 
            color: #1a202c;
        }

        /* Navigasi / Header Admin */
        .admin-header {
            background: var(--primary-color);
            color: white;
            padding: 20px 40px;
            border-bottom: 4px solid var(--accent-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-header h1 { margin: 0; font-size: 1.4rem; text-transform: uppercase; font-weight: 800; }

        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }

        /* Statistik Box */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--white);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-top: 4px solid var(--accent-color);
        }
        .stat-card h3 { margin: 0; font-size: 0.8rem; color: #718096; text-transform: uppercase; }
        .stat-card p { margin: 10px 0 0; font-size: 1.8rem; font-weight: 800; color: var(--primary-color); }

        /* Tab Penapis Kampus */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            background: #e2e8f0;
            color: #4a5568;
            transition: 0.3s;
        }
        .tab-btn.active {
            background: var(--primary-color);
            color: white;
        }

        /* Jadual Data */
        .table-container {
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
            overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; }
        th { 
            background: #f8fafc; 
            padding: 15px; 
            text-align: left; 
            font-size: 0.8rem; 
            text-transform: uppercase; 
            color: var(--primary-color);
            border-bottom: 2px solid #edf2f7;
        }
        td { padding: 15px; border-bottom: 1px solid #edf2f7; font-size: 0.9rem; }

        /* Status Badges */
        .badge {
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
        }
        .Menunggu { background: #fff3cd; color: #856404; }
        .Lulus { background: #c6f6d5; color: #22543d; }
        .Tolak { background: #fed7d7; color: #822727; }

        /* Butang Tindakan */
        .btn-lulus { background: var(--success); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: 700; }
        .btn-tolak { background: var(--danger); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: 700; }
        .btn-reset { background: #718096; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.7rem; }

        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

<div class="admin-header">
    <h1>Dashboard Pentadbir PKUMK</h1>
    <button onclick="fetchData()" style="background: var(--accent-color); border:none; padding:10px 15px; border-radius:8px; font-weight:800; cursor:pointer;">KEMASKINI DATA</button>
</div>

<div class="container">
    <div class="stats-grid">
        <div class="stat-card"><h3>Keseluruhan</h3><p id="count-all">0</p></div>
        <div class="stat-card"><h3>Bachok</h3><p id="count-bachok">0</p></div>
        <div class="stat-card"><h3>Kota</h3><p id="count-kota">0</p></div>
        <div class="stat-card"><h3>Jeli</h3><p id="count-jeli">0</p></div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="filterData('all', this)">SEMUA</button>
        <button class="tab-btn" onclick="filterData('bachok', this)">BACHOK</button>
        <button class="tab-btn" onclick="filterData('kota', this)">KOTA</button>
        <button class="tab-btn" onclick="filterData('jeli', this)">JELI</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Pemohon</th>
                    <th>Studio & Kampus</th>
                    <th>Tarikh & Masa</th>
                    <th>Status</th>
                    <th>Tindakan</th>
                </tr>
            </thead>
            <tbody id="data-list">
                </tbody>
        </table>
    </div>
</div>

<script>
    const supabaseUrl = 'https://gwiuqthmkkvbopapixwk.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd3aXVxdGhta2t2Ym9wYXBpeHdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc4NDgyMDUsImV4cCI6MjA4MzQyNDIwNX0.fulrwEdy3ngAGG5gp3Vw950wV1r3-wSWvtRsWmz0uEg';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    let allData = [];

    async function fetchData() {
        const { data, error } = await _supabase
            .from('bookings')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            alert("Ralat: " + error.message);
        } else {
            allData = data;
            updateStats();
            renderTable(allData);
        }
    }

    function updateStats() {
        document.getElementById('count-all').innerText = allData.length;
        document.getElementById('count-bachok').innerText = allData.filter(d => d.campus === 'bachok').length;
        document.getElementById('count-kota').innerText = allData.filter(d => d.campus === 'kota').length;
        document.getElementById('count-jeli').innerText = allData.filter(d => d.campus === 'jeli').length;
    }

    function renderTable(list) {
        const tbody = document.getElementById('data-list');
        tbody.innerHTML = '';

        list.forEach(item => {
            const reasonMarkup = (item.status === 'Tolak' && item.reason) 
                ? `<br><small style="color:red">Sebab: ${item.reason}</small>` 
                : '';

            tbody.innerHTML += `
                <tr>
                    <td><strong>${item.full_name}</strong><br><small>${item.student_staff_id}</small></td>
                    <td><strong>${item.studio_name}</strong><br><small>${item.campus.toUpperCase()}</small></td>
                    <td>${item.start_date} hingga ${item.end_date}<br><small>${item.start_time} - ${item.end_time}</small></td>
                    <td><span class="badge ${item.status}">${item.status}</span>${reasonMarkup}</td>
                    <td>
                        ${item.status === 'Menunggu' ? `
                            <button class="btn-lulus" onclick="updateStatus(${item.id}, 'Lulus')">LULUS</button>
                            <button class="btn-tolak" onclick="updateStatus(${item.id}, 'Tolak')">TOLAK</button>
                        ` : `
                            <button class="btn-reset" onclick="updateStatus(${item.id}, 'Menunggu')">RESET</button>
                        `}
                    </td>
                </tr>
            `;
        });
    }

    async function updateStatus(id, status) {
        let reason = null;
        if (status === 'Tolak') {
            reason = prompt("Sila nyatakan sebab penolakan:");
            if (reason === null) return; // Batal jika tekan cancel
            if (reason.trim() === "") { alert("Sebab penolakan wajib diisi!"); return; }
        }

        const { error } = await _supabase
            .from('bookings')
            .update({ status: status, reason: reason })
            .eq('id', id);

        if (error) alert("Gagal mengemaskini: " + error.message);
        else fetchData();
    }

    function filterData(campus, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        if (campus === 'all') renderTable(allData);
        else renderTable(allData.filter(d => d.campus === campus));
    }

    // Jalankan carian data bila buka page
    fetchData();
</script>
</body>
</html>
