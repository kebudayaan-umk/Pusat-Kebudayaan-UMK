<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard PKUMK</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #003366; --accent: #d4af37; --bg: #f4f7f9; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; }
        .nav { background: var(--primary); color: white; padding: 20px 40px; border-bottom: 5px solid var(--accent); display: flex; justify-content: space-between; }
        .container { max-width: 1300px; margin: 30px auto; padding: 0 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-top: 4px solid var(--accent); }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; }
        .tab-btn.active { background: var(--primary); color: white; }
        .table-box { background: white; border-radius: 12px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #edf2f7; }
        .badge { padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: 800; text-transform: uppercase; }
        .bg-pending { background: #fff3cd; color: #856404; }
        .bg-approved { background: #d4edda; color: #155724; }
        .bg-rejected { background: #f8d7da; color: #721c24; }
        .btn-action { padding: 6px 12px; border-radius: 4px; border: none; font-weight: 700; cursor: pointer; color: white; }
    </style>
</head>
<body>
<div class="nav"><h2>Dashboard Admin PKUMK</h2><button onclick="fetchAll()">KEMASKINI DATA</button></div>
<div class="container">
    <div class="stats-grid">
        <div class="stat-card"><h3>Total</h3><p id="sTotal">0</p></div>
        <div class="stat-card"><h3>Bachok</h3><p id="sBachok">0</p></div>
        <div class="stat-card"><h3>Kota</h3><p id="sKota">0</p></div>
        <div class="stat-card"><h3>Jeli</h3><p id="sJeli">0</p></div>
    </div>
    <div class="tabs">
        <button class="tab-btn active" onclick="filter('all', this)">SEMUA</button>
        <button class="tab-btn" onclick="filter('bachok', this)">BACHOK</button>
        <button class="tab-btn" onclick="filter('kota', this)">KOTA</button>
        <button class="tab-btn" onclick="filter('jeli', this)">JELI</button>
    </div>
    <div class="table-box">
        <table>
            <thead><tr><th>PEMOHON</th><th>STUDIO</th><th>TARIKH & MASA</th><th>STATUS</th><th>TINDAKAN</th></tr></thead>
            <tbody id="list"></tbody>
        </table>
    </div>
</div>
<script>
    const supabaseUrl = 'https://gwiuqthmkkvbopapixwk.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd3aXVxdGhta2t2Ym9wYXBpeHdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc4NDgyMDUsImV4cCI6MjA4MzQyNDIwNX0.fulrwEdy3ngAGG5gp3Vw950wV1r3-wSWvtRsWmz0uEg';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);
    let dataCache = [];

    async function fetchAll() {
        const { data } = await _supabase.from('bookings').select('*').order('created_at', { ascending: false });
        dataCache = data || [];
        updateStats(); render(dataCache);
    }

    function updateStats() {
        document.getElementById('sTotal').innerText = dataCache.length;
        document.getElementById('sBachok').innerText = dataCache.filter(b => b.campus === 'bachok').length;
        document.getElementById('sKota').innerText = dataCache.filter(b => b.campus === 'kota').length;
        document.getElementById('sJeli').innerText = dataCache.filter(b => b.campus === 'jeli').length;
    }

    function render(list) {
        const tbody = document.getElementById('list'); tbody.innerHTML = '';
        list.forEach(b => {
            const statusColor = b.status === 'Lulus' ? 'bg-approved' : (b.status === 'Tolak' ? 'bg-rejected' : 'bg-pending');
            const reasonText = (b.status === 'Tolak' && b.reason) ? `<br><small style="color:red">Sebab: ${b.reason}</small>` : '';
            tbody.innerHTML += `<tr>
                <td><strong>${b.full_name}</strong><br><small>${b.student_staff_id}</small></td>
                <td>${b.studio_name}<br><small>${b.campus.toUpperCase()}</small></td>
                <td>${b.start_date}<br><small>${b.start_time} - ${b.end_time}</small></td>
                <td><span class="badge ${statusColor}">${b.status}</span>${reasonText}</td>
                <td>
                    ${b.status === 'Menunggu' ? `
                        <button class="btn-action" style="background:green" onclick="updateStatus(${b.id}, 'Lulus')">LULUS</button>
                        <button class="btn-action" style="background:red" onclick="updateStatus(${b.id}, 'Tolak')">TOLAK</button>
                    ` : `<button onclick="updateStatus(${b.id}, 'Menunggu')" style="font-size:10px; cursor:pointer">Reset</button>`}
                </td>
            </tr>`;
        });
    }

    async function updateStatus(id, s) {
        let reasonInput = null;
        if(s === 'Tolak') { 
            reasonInput = prompt("Sila masukkan sebab penolakan:"); 
            if(reasonInput === null) return;
            if(!reasonInput.trim()) { alert("Sebab wajib diisi!"); return; }
        }
        await _supabase.from('bookings').update({ status: s, reason: reasonInput }).eq('id', id);
        fetchAll();
    }

    function filter(c, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render(c === 'all' ? dataCache : dataCache.filter(b => b.campus === c));
    }

    fetchAll();
</script>
</body>
</html>
