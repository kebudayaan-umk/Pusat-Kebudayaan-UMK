<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Sistem Tempahan Studio PKUMK</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary-color: #003366;
            --accent-color: #d4af37;
            --bg-color: #f0f2f5;
            --text-dark: #1a202c;
            --white: #ffffff;
            --success: #2f855a;
            --danger: #e53e3e;
            --warning: #dd6b20;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            background-color: var(--bg-color); 
            color: var(--text-dark); 
        }

        /* Navigasi */
        nav {
            background: var(--primary-color);
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--accent-color);
        }

        nav h1 { margin: 0; font-size: 1.2rem; text-transform: uppercase; }

        .container { 
            max-width: 1200px; 
            margin: 30px auto; 
            padding: 0 20px; 
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
        }

        .stat-card h3 { margin: 0; color: #718096; font-size: 0.9rem; }
        .stat-card p { margin: 10px 0 0; font-size: 1.8rem; font-weight: 800; color: var(--primary-color); }

        /* Jadual */
        .table-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        thead {
            background: #edf2f7;
            color: var(--primary-color);
            font-weight: 800;
            text-transform: uppercase;
            font-size: 0.75rem;
        }

        th, td { padding: 15px; border-bottom: 1px solid #e2e8f0; }

        tr:hover { background-color: #f7fafc; }

        .status-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .status-menunggu { background: #feebc8; color: #9c4221; }
        .status-lulus { background: #c6f6d5; color: #22543d; }
        .status-tolak { background: #fed7d7; color: #822727; }

        .action-btns { display: flex; gap: 5px; }

        button {
            cursor: pointer;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            font-weight: 600;
            font-size: 0.7rem;
            transition: 0.2s;
        }

        .btn-lulus { background: var(--success); color: white; }
        .btn-tolak { background: var(--danger); color: white; }
        .btn-lulus:hover { background: #276749; }
        .btn-tolak:hover { background: #9b2c2c; }

        #loading { text-align: center; padding: 20px; font-weight: bold; }

        @media (max-width: 1000px) {
            .table-container { overflow-x: auto; }
        }
    </style>
</head>
<body>

<nav>
    <h1>Panel Pentadbir Studio PBS</h1>
    <button onclick="fetchBookings()" style="background: var(--accent-color); color: var(--primary-color);">Refresh Data</button>
</nav>

<div class="container">
    <div class="stats-grid">
        <div class="stat-card">
            <h3>Jumlah Tempahan</h3>
            <p id="totalCount">0</p>
        </div>
        <div class="stat-card">
            <h3>Menunggu</h3>
            <p id="pendingCount" style="color: var(--warning);">0</p>
        </div>
        <div class="stat-card">
            <h3>Diluluskan</h3>
            <p id="approvedCount" style="color: var(--success);">0</p>
        </div>
    </div>

    <div class="table-container">
        <div id="loading">Memuatkan data dari pangkalan data...</div>
        <table id="adminTable" style="display: none;">
            <thead>
                <tr>
                    <th>Nama Pemohon</th>
                    <th>Studio & Kampus</th>
                    <th>Tarikh (Mula - Tamat)</th>
                    <th>Masa</th>
                    <th>Status</th>
                    <th>Tindakan</th>
                </tr>
            </thead>
            <tbody id="bookingList">
                </tbody>
        </table>
    </div>
</div>

<script>
    // --- 1. KONFIGURASI SUPABASE (Sama seperti borang anda) ---
    const supabaseUrl = 'https://gwiuqthmkkvbopapixwk.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd3aXVxdGhta2t2Ym9wYXBpeHdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc4NDgyMDUsImV4cCI6MjA4MzQyNDIwNX0.fulrwEdy3ngAGG5gp3Vw950wV1r3-wSWvtRsWmz0uEg';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    // --- 2. FUNGSI AMBIL DATA ---
    async function fetchBookings() {
        document.getElementById('loading').style.display = 'block';
        document.getElementById('adminTable').style.display = 'none';

        try {
            const { data, error } = await _supabase
                .from('bookings')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) throw error;

            renderTable(data);
            updateStats(data);
        } catch (err) {
            alert("Ralat memuatkan data: " + err.message);
        } finally {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('adminTable').style.display = 'table';
        }
    }

    // --- 3. PAPARKAN DATA DALAM JADUAL ---
    function renderTable(bookings) {
        const list = document.getElementById('bookingList');
        list.innerHTML = '';

        bookings.forEach(b => {
            const row = document.createElement('tr');
            
            // Format Status Badge
            let statusClass = 'status-menunggu';
            if(b.status === 'Lulus') statusClass = 'status-lulus';
            if(b.status === 'Tolak') statusClass = 'status-tolak';

            row.innerHTML = `
                <td>
                    <strong>${b.full_name}</strong><br>
                    <small>${b.student_staff_id} (${b.category})</small>
                </td>
                <td>
                    ${b.studio_name}<br>
                    <small>${b.campus.toUpperCase()}</small>
                </td>
                <td>${b.start_date} <br> <small>sehingga</small> <br> ${b.end_date}</td>
                <td>${b.start_time} - ${b.end_time}</td>
                <td><span class="status-badge ${statusClass}">${b.status}</span></td>
                <td class="action-btns">
                    ${b.status === 'Menunggu' ? `
                        <button class="btn-lulus" onclick="updateStatus(${b.id}, 'Lulus')">Lulus</button>
                        <button class="btn-tolak" onclick="updateStatus(${b.id}, 'Tolak')">Tolak</button>
                    ` : `<small>Selesai</small>`}
                </td>
            `;
            list.appendChild(row);
        });
    }

    // --- 4. KEMASKINI STATUS ---
    async function updateStatus(id, newStatus) {
        if(!confirm(`Adakah anda pasti mahu set status ke ${newStatus}?`)) return;

        try {
            const { error } = await _supabase
                .from('bookings')
                .update({ status: newStatus })
                .eq('id', id);

            if (error) throw error;
            alert("Status dikemaskini!");
            fetchBookings(); // Refresh senarai
        } catch (err) {
            alert("Gagal mengemaskini: " + err.message);
        }
    }

    // --- 5. KEMASKINI STATISTIK ---
    function updateStats(data) {
        document.getElementById('totalCount').innerText = data.length;
        document.getElementById('pendingCount').innerText = data.filter(b => b.status === 'Menunggu').length;
        document.getElementById('approvedCount').innerText = data.filter(b => b.status === 'Lulus').length;
    }

    // Jalankan semasa page dibuka
    fetchBookings();
</script>

</body>
</html>
