<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Tempahan Studio PKUMK</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #003366; --accent: #d4af37; --bg: #f4f7f6; --success: #27ae60; --danger: #e74c3c; --warning: #f39c12; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .admin-container { max-width: 1300px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--accent); padding-bottom: 20px; margin-bottom: 20px; }
        h1 { color: var(--primary); margin: 0; font-size: 1.5rem; text-transform: uppercase; }
        
        .filters { display: flex; gap: 10px; margin-bottom: 20px; }
        select { padding: 10px; border-radius: 6px; border: 1px solid #ddd; font-family: inherit; }

        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
        th { background: var(--primary); color: white; padding: 15px; text-align: left; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid #eee; vertical-align: top; }
        tr:hover { background: #f9f9f9; }

        .status-badge { padding: 5px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 800; color: white; display: inline-block; margin-bottom: 5px; }
        .status-menunggu { background: var(--warning); }
        .status-lulus { background: var(--success); }
        .status-ditolak { background: var(--danger); }

        .reason-text { color: var(--danger); font-style: italic; font-size: 0.8rem; display: block; margin-top: 5px; border-left: 2px solid var(--danger); padding-left: 5px; }

        .btn-action { padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: 700; font-size: 0.7rem; margin-bottom: 5px; color: white; text-transform: uppercase; width: 100%; display: block; }
        .btn-lulus { background: var(--success); }
        .btn-tolak { background: var(--danger); }
        .btn-delete { background: #666; }

        .loading { text-align: center; padding: 20px; font-weight: bold; color: var(--primary); }
    </style>
</head>
<body>

<div class="admin-container">
    <div class="admin-header">
        <h1>Panel Pengurusan Tempahan Studio</h1>
        <button onclick="fetchBookings()" class="btn-action btn-delete" style="width:auto; padding:10px 20px">Refresh Data</button>
    </div>

    <div class="filters">
        <select id="filterStatus" onchange="renderTable()">
            <option value="Semua">Semua Status</option>
            <option value="Menunggu">Menunggu</option>
            <option value="Lulus">Lulus</option>
            <option value="Ditolak">Ditolak</option>
        </select>
    </div>

    <div class="table-wrapper">
        <table id="bookingTable">
            <thead>
                <tr>
                    <th style="width: 20%;">Pemohon</th>
                    <th style="width: 15%;">Studio</th>
                    <th style="width: 20%;">Tarikh & Masa</th>
                    <th style="width: 20%;">Teknikal / Catatan</th>
                    <th style="width: 10%;">Status</th>
                    <th style="width: 15%;">Tindakan</th>
                </tr>
            </thead>
            <tbody id="bookingList"></tbody>
        </table>
        <div id="loader" class="loading">Memuatkan data tempahan...</div>
    </div>
</div>

<script>
    const supabaseUrl = 'https://gwiuqthmkkvbopapixwk.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd3aXVxdGhta2t2Ym9wYXBpeHdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc4NDgyMDUsImV4cCI6MjA4MzQyNDIwNX0.fulrwEdy3ngAGG5gp3Vw950wV1r3-wSWvtRsWmz0uEg';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    let allBookings = [];

    async function fetchBookings() {
        document.getElementById('loader').style.display = 'block';
        const { data, error } = await _supabase
            .from('bookings')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) alert("Ralat: " + error.message);
        else {
            allBookings = data;
            renderTable();
        }
        document.getElementById('loader').style.display = 'none';
    }

    function renderTable() {
        const filter = document.getElementById('filterStatus').value;
        const list = document.getElementById('bookingList');
        list.innerHTML = '';

        const filteredData = filter === 'Semua' ? allBookings : allBookings.filter(b => b.status === filter);

        filteredData.forEach(b => {
            const reasonMarkup = b.reason ? `<span class="reason-text">Sebab: ${b.reason}</span>` : '';
            
            const row = `
                <tr>
                    <td>
                        <strong>${b.full_name}</strong><br>
                        <small>ID: ${b.student_staff_id}<br>IC: ${b.ic_number}</small>
                    </td>
                    <td>
                        <strong>${b.studio_name}</strong><br>
                        <small>${b.campus.toUpperCase()}</small>
                    </td>
                    <td>
                        ${b.start_date} - ${b.end_date}<br>
                        <small>${b.start_time} hingga ${b.end_time}</small>
                    </td>
                    <td><small>${b.technical_requirements || '-'}</small></td>
                    <td>
                        <span class="status-badge status-${b.status.toLowerCase()}">${b.status}</span>
                        ${reasonMarkup}
                    </td>
                    <td>
                        ${b.status === 'Menunggu' ? `
                            <button onclick="updateStatus('${b.id}', 'Lulus')" class="btn-action btn-lulus">Lulus</button>
                            <button onclick="rejectBooking('${b.id}')" class="btn-action btn-tolak">Tolak</button>
                        ` : `
                            <button onclick="deleteBooking('${b.id}')" class="btn-action btn-delete">Padam</button>
                        `}
                    </td>
                </tr>
            `;
            list.innerHTML += row;
        });
    }

    async function updateStatus(id, newStatus, reason = null) {
        const updateData = { status: newStatus };
        if (reason) updateData.reason = reason;

        const { error } = await _supabase
            .from('bookings')
            .update(updateData)
            .eq('id', id);

        if (error) alert("Gagal kemaskini: " + error.message);
        else fetchBookings();
    }

    function rejectBooking(id) {
        const msg = prompt("Sila masukkan sebab penolakan (Wajib):");
        if (msg === null) return; // Batal tekan butang
        if (msg.trim() === "") {
            alert("Anda mesti masukkan sebab untuk menolak!");
            return;
        }
        updateStatus(id, 'Ditolak', msg);
    }

    async function deleteBooking(id) {
        if(confirm("Padam rekod ini secara kekal?")) {
            const { error } = await _supabase.from('bookings').delete().eq('id', id);
            if (error) alert("Gagal padam: " + error.message);
            else fetchBookings();
        }
    }

    fetchBookings();
</script>
</body>
</html>
